skill: 015-outreach-specialist
version: 2
total_items: 12
criteria:
- id: C04
  category: process
  fatal: false
  text: The two reference files are read in Step 1 order (outreach-templates.md then sequence-strategy.md) before FOUNDER_CONTEXT.md is read in Step 2.
  anchor: Inspect tool_log for the relative ordering of the three Read calls.
  judge: combo
  combine: and
  parts:
    script:
      kind: tool_log_order
      cmds:
      - references/outreach-templates.md
      - references/sequence-strategy.md
      - FOUNDER_CONTEXT
    llm:
      question: The two reference files are read in Step 1 order (outreach-templates.md then sequence-strategy.md) before FOUNDER_CONTEXT.md is read in Step 2.
      evidence: Inspect tool_log for the relative ordering of the three Read calls.
      source: tool_log
      pattern: references/outreach-templates.md|references/sequence-strategy.md|FOUNDER_CONTEXT
- id: C07
  category: termination
  fatal: false
  text: The agent asks at most 5 diagnostic questions and stops asking as soon as it has enough information to write a confident sequence.
  anchor: Count questions asked across the agent's transcript.
  judge: llm
  check:
    question: The agent asks at most 5 diagnostic questions and stops asking as soon as it has enough information to write a confident sequence.
    evidence: Count questions asked across the agent's transcript.
- id: C08
  category: format
  fatal: false
  text: The output opens with the '## Outreach Sequence' heading.
  anchor: Look in the agent's final output for the heading line.
  judge: combo
  combine: and
  parts:
    script:
      kind: output_contains
      needle: '## Outreach Sequence'
    llm:
      question: The output opens with the '## Outreach Sequence' heading.
      evidence: Look in the agent's final output for the heading line.
      source: output
      needle: '## Outreach Sequence'
- id: C14
  category: content
  fatal: false
  text: The value proposition of roughly 40% lower data-labeling cost is included in the outreach.
  anchor: Search the final output for the cost-reduction percentage.
  judge: combo
  combine: and
  parts:
    script:
      kind: numeric_threshold
      in: output
      key: 40%
      op: eq
      n: 40
    llm:
      question: The value proposition of roughly 40% lower data-labeling cost is included in the outreach.
      evidence: Search the final output for the cost-reduction percentage.
      source: output
      needle: 40%
- id: C15
