  judge: combo
  combine: and
  parts:
    script:
      kind: numeric_threshold
      in: output
      key: 15,000
      op: eq
      n: 15000
    llm:
      question: 'At least one message includes the approved case study with specific numbers: monthly labeling cost cut from about 24,000 to about 15,000 RMB within 6 weeks.'
      evidence: Search the message bodies for the post-reduction monthly figure.
      source: output
      needle: 15,000
