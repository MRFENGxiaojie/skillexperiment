criteria:
- id: C02
  category: format
  fatal: true
  text: The agent writes the archivable decision memo as a markdown file named `decision_memo.md` in the working directory.
  anchor: Run filesystem — decision_memo.md exists at the working-directory root.
  judge: combo
  combine: and
  parts:
    script:
      kind: file_exists
      path: decision_memo.md
    llm:
      question: The agent writes the archivable decision memo as a markdown file named `decision_memo.md` in the working directory.
      evidence: Run filesystem — decision_memo.md exists at the working-directory root.
      source: workspace
      path: decision_memo.md
- id: C03
  category: format
  fatal: true
  text: The decision memo contains four required sections — Verdict, Why, What would change the decision, and Next smallest reversible step — each with substantive content.
  anchor: decision_memo.md — each of the four section headings appears with content beneath it.
  judge: combo
  combine: and
  parts:
    script:
      kind: section_nonempty
      path: decision_memo.md
      headers:
      - Verdict
      - Why
      - What would change the decision
      - Next smallest reversible step
      min_chars: 10
    llm:
      question: The decision memo contains four required sections — Verdict, Why, What would change the decision, and Next smallest reversible step — each with substantive content.
      evidence: decision_memo.md — each of the four section headings appears with content beneath it.
      source: workspace
      path: decision_memo.md
- id: C04
  category: termination
  fatal: false
  text: 'The verdict is not GO: with only oral interviews and no behavioral commitment evidence (no paid commitment, no prototype), the skill forbids a GO verdict.'
  anchor: decision_memo.md Verdict section — confirm the stated verdict is not GO.
  judge: llm
  check:
    question: 'The verdict is not GO: with only oral interviews and no behavioral commitment evidence (no paid commitment, no prototype), the skill forbids a GO verdict.'
    evidence: decision_memo.md Verdict section — confirm the stated verdict is not GO.
- id: C05
  category: content
  fatal: false
  text: The stated verdict is consistent with the stated composite score per the verdict thresholds (80-100 GO, 60-79 CONDITIONAL, 40-59 PIVOT, <40 NO-GO).
  anchor: decision_memo.md — cross-check the composite score against the verdict band.
  judge: llm
  check:
    question: The stated verdict is consistent with the stated composite score per the verdict thresholds (80-100 GO, 60-79 CONDITIONAL, 40-59 PIVOT, <40 NO-GO).
    evidence: decision_memo.md — cross-check the composite score against the verdict band.
- id: C06
