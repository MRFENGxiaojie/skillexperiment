- id: C33
  category: negative
  fatal: false
  text: The primary metric is not changed after the experiment starts (no post-hoc metric selection).
  anchor: Compare the metric used in the analysis against the metric named in the original design.
  judge: llm
  check:
    question: The primary metric is not changed after the experiment starts (no post-hoc metric selection).
    evidence: Compare the metric used in the analysis against the metric named in the original design.
- id: C35
  category: negative
  fatal: false
  text: The decision is not based on secondary metrics when the primary metric is flat.
  anchor: Examine the decision rationale in the report.
  judge: llm
  check:
    question: The decision is not based on secondary metrics when the primary metric is flat.
    evidence: Examine the decision rationale in the report.
- id: C36
  category: negative
  fatal: false
  text: The same user's repeated sessions are not counted as independent samples.
  anchor: Examine the analysis methodology for unit-of-analysis handling.
  judge: llm
  check:
    question: The same user's repeated sessions are not counted as independent samples.
    evidence: Examine the analysis methodology for unit-of-analysis handling.
- id: C37
  category: negative
  fatal: true
  text: The losing variant code and feature flag are not left in place after the experiment concludes.
  anchor: Look at the final cleanup instructions; failure here mirrors critical failure CF-02.
  judge: llm
  check:
    question: The losing variant code and feature flag are not left in place after the experiment concludes.
    evidence: Look at the final cleanup instructions; failure here mirrors critical failure CF-02.
- id: C38
  category: termination
  fatal: false
  text: If a guardrail metric (error rate / P95) degrades during the run, the experiment is stopped, rolled back to control, and investigated before any restart or winner decision.
  anchor: Look for the guardrail-degradation handling rule in the plan.
  judge: combo
  combine: and
  parts:
    script:
      kind: output_contains
      needle: roll back
    llm:
      question: If a guardrail metric (error rate / P95) degrades during the run, the experiment is stopped, rolled back to control, and investigated before any restart or winner decision.
      evidence: Look for the guardrail-degradation handling rule in the plan.
      source: output
      needle: roll back
- id: C39
  category: boundary
  fatal: false
  text: If a user is observed receiving different variants across sessions, sticky bucketing is diagnosed as broken and the assignment logic is fixed before results are treated as valid.
  anchor: Look for the sticky-bucketing error-handling rule in the plan.
  judge: combo
  combine: and
  parts:
    script:
      kind: output_contains
      needle: assignment logic
    llm:
      question: If a user is observed receiving different variants across sessions, sticky bucketing is diagnosed as broken and the assignment logic is fixed before results are treated as valid.
      evidence: Look for the sticky-bucketing error-handling rule in the plan.
      source: output
      needle: assignment logic
- id: C41
  category: coverage
  fatal: false
  text: 'The experiment plan covers all eight requested elements: hypothesis, primary metric, required traffic (sample size), minimum duration, stable grouping, adoption decision rule, cleanup of code and
    flag, and guardrail monitoring.'
  anchor: Cross-check the plan against the task's enumerated questions.
  judge: llm
  check:
