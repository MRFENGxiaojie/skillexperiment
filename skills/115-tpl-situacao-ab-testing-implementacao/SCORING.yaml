      needle: conversions
    llm:
      question: The Experiment Report includes per-variant visitor and conversion counts.
      evidence: Look in the Results section for per-variant visitor/conversion figures.
      source: output
      needle: conversions
- id: C28
  category: process
  fatal: false
  text: After the experiment, the winning variant is deployed as the permanent implementation.
  anchor: Look in the Next Steps / cleanup section for the winner-deployment step.
  judge: combo
  combine: and
  parts:
    script:
      kind: output_contains
      needle: Deploy treatment
    llm:
      question: After the experiment, the winning variant is deployed as the permanent implementation.
      evidence: Look in the Next Steps / cleanup section for the winner-deployment step.
      source: output
      needle: Deploy treatment
- id: C29
  category: process
  fatal: false
  text: After the experiment, the losing variant code is removed from the codebase.
  anchor: Look in the Next Steps / cleanup section for removal of the losing variant.
  judge: combo
  combine: and
  parts:
    script:
      kind: output_contains
      needle: losing variant
    llm:
      question: After the experiment, the losing variant code is removed from the codebase.
      evidence: Look in the Next Steps / cleanup section for removal of the losing variant.
