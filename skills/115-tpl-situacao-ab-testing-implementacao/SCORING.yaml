skill: 115-tpl-situacao-ab-testing-implementacao
version: 2
total_items: 25
criteria:
- id: C08
  category: format
  fatal: false
  text: The design includes a "Required Sample Size" field stating a computed number of users per variant.
  anchor: Look for a Required Sample Size line in the experiment design.
  judge: combo
  combine: and
  parts:
    script:
      kind: output_contains
      needle: Required Sample Size
    llm:
      question: The design includes a "Required Sample Size" field stating a computed number of users per variant.
      evidence: Look for a Required Sample Size line in the experiment design.
      source: output
      needle: Required Sample Size
- id: C09
  category: content
  fatal: false
  text: The reported required sample size is consistent with a two-proportion power analysis for a 3.2% to 3.5% lift (roughly 50,000-65,000 users per variant).
  anchor: Compare the reported sample-size figure against the power-analysis result for base rate 3.2% and MDE to 3.5%.
  judge: combo
  combine: and
  parts:
    script:
      kind: numeric_threshold
      in: output
      key: Sample Size[^0-9]{0,40}([0-9][0-9,]*)
      op: ge
      n: 50000
    llm:
      question: The reported required sample size is consistent with a two-proportion power analysis for a 3.2% to 3.5% lift (roughly 50,000-65,000 users per variant).
      evidence: Compare the reported sample-size figure against the power-analysis result for base rate 3.2% and MDE to 3.5%.
      source: output
      needle: Sample Size[^0-9]{0,40}([0-9][0-9,]*)
- id: C11
  category: format
  fatal: false
  text: The design states a confidence level of 95%.
  anchor: Look for the confidence level in the experiment design or power-analysis section.
  judge: combo
  combine: and
  parts:
    script:
      kind: output_contains
      needle: 95%
    llm:
      question: The design states a confidence level of 95%.
      evidence: Look for the confidence level in the experiment design or power-analysis section.
      source: output
      needle: 95%
- id: C12
  category: tool
  fatal: false
  text: The agent runs a power-analysis computation (80% power, 95% confidence) to derive the required sample size.
  anchor: Inspect the tool log for the executed power-analysis command and its output.
  judge: combo
  combine: and
  parts:
    script:
      kind: tool_log_contains
      cmd: 95% confidence
    llm:
      question: The agent runs a power-analysis computation (80% power, 95% confidence) to derive the required sample size.
      evidence: Inspect the tool log for the executed power-analysis command and its output.
      source: tool_log
      pattern: 95% confidence
- id: C16
  category: process
  fatal: false
  text: Sticky bucketing is implemented so the same user always receives the same variant across sessions.
  anchor: Look for the assignment/bucketing description in the experiment design.
  judge: combo
  combine: and
  parts:
    script:
      kind: output_contains
      needle: sticky
    llm:
      question: Sticky bucketing is implemented so the same user always receives the same variant across sessions.
      evidence: Look for the assignment/bucketing description in the experiment design.
      source: output
      needle: sticky
- id: C20
  category: process
  fatal: false
  text: Bot/crawler traffic is excluded from the experiment analysis.
  anchor: Look in the analysis methodology for a bot/crawler filtering step.
  judge: combo
  combine: and
  parts:
    script:
      kind: output_contains
      needle: bot
    llm:
      question: Bot/crawler traffic is excluded from the experiment analysis.
      evidence: Look in the analysis methodology for a bot/crawler filtering step.
      source: output
      needle: bot
- id: C21
  category: process
  fatal: false
  text: The analysis applies a two-proportion z-test at alpha = 0.05.
  anchor: Look for the significance-test method in the analysis section.
  judge: combo
  combine: and
  parts:
    script:
      kind: output_contains
      needle: z-test
    llm:
