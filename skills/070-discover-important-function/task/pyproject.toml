[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaml-utils"
version = "0.4.2"
description = "Parsing and serialization for the YamlUtils YAML variant (input from untrusted external sources)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
include = ["yaml_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
