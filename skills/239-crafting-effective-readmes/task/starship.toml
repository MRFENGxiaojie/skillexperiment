# starship 配置
add_newline = true

[character]
success_symbol = "[➜](bold green) "
error_symbol = "[➜](bold red) "

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "

[git_status]
conflicted = "="
ahead = "⇡"
behind = "⇣"

[nodejs]
symbol = ""

[python]
symbol = ""

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow)"
