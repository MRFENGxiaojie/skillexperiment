criteria:
- id: C01
  category: tool
  fatal: false
  text: The agent extracts the provided feedback-data.zip archive so the 
    contained data files become available.
  anchor: Check the tool log for a Bash/extract command referencing 
    feedback-data.zip (e.g., unzip feedback-data.zip).
  judge: combo
  combine: and
  parts:
    script:
      kind: command_succeeded
      cmd: feedback-data.zip
      expect: success
    llm:
      question: The agent extracts the provided feedback-data.zip archive so the
        contained data files become available.
      evidence: Check the tool log for a Bash/extract command referencing 
        feedback-data.zip (e.g., unzip feedback-data.zip).
      source: tool_log
      pattern: feedback-data.zip
- id: C06
  category: process
  fatal: false
  text: The feedback archive is handled before the individual data files are 
    read.
  anchor: Verify in the tool log that a call mentioning feedback-data.zip 
    precedes any call reading in-app-feedback.csv.
  judge: combo
  combine: and
  parts:
    script:
      kind: tool_log_order
      cmds:
      - feedback-data.zip
      - in-app-feedback.csv
    llm:
      question: The feedback archive is handled before the individual data files
        are read.
      evidence: Verify in the tool log that a call mentioning feedback-data.zip 
        precedes any call reading in-app-feedback.csv.
      source: tool_log
      pattern: feedback-data.zip|in-app-feedback.csv
- id: C07
