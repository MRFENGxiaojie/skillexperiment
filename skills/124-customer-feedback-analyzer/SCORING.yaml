  fatal: false
  text: The final analysis incorporates all four provided channels — in-app 
    feedback, support tickets, NPS survey, and interviews — with none omitted.
  anchor: Review the final summary to confirm all four channels are represented 
    and none is silently dropped.
  judge: llm
  check:
