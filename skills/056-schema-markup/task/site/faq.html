<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>常见问题 - 青禾花艺</title>
</head>
<body>
  <main>
    <h1>常见问题</h1>
    <section class="faq">
      <h2>购买与配送</h2>
      <details>
        <summary>花束可以当天送达吗？</summary>
        <p>可以。每日 16:00 前下单，同城当天送达；16:00 后下单次日送达。急单可联系客服加急。</p>
      </details>
      <details>
        <summary>如何查看订单配送进度？</summary>
        <p>下单后您会收到短信，包含顺丰运单号；也可以登录网站"我的订单"查看实时物流。</p>
      </details>
      <details>
        <summary>鲜花可以保存多久？</summary>
        <p>正常养护下花期约 5-7 天。建议收到后剪根、换水，并放置在阴凉通风处。</p>
      </details>
      <details>
        <summary>可以定制贺卡内容吗？</summary>
        <p>可以，下单时在备注栏填写贺卡内容（50 字以内），我们会手写附上。</p>
      </details>
      <details>
        <summary>支持开发票吗？</summary>
        <p>支持。订单完成后 7 天内可申请电子发票，抬头为个人或公司均可。</p>
      </details>
    </section>
  </main>
  <footer>© 青禾花艺</footer>
</body>
</html>
