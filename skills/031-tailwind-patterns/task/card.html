<!-- 数据卡片组件示例：多个页面复用，样式需统一 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据卡片示例</title>
</head>
<body>
  <!-- 仪表盘页 -->
  <div class="card">
    <div class="card-header"><span>本月支出</span><button>详情</button></div>
    <div class="stat">¥12,480</div>
    <div class="chart"><!-- 图表占位 --></div>
    <div class="footer"><span>较上月 +8.2%</span></div>
  </div>

  <!-- 报表页变体 -->
  <div class="card">
    <div class="card-header"><span>本月收入</span><button>详情</button></div>
    <div class="stat">¥18,920</div>
    <div class="chart"><!-- 图表占位 --></div>
    <div class="footer"><span>较上月 +3.1%</span></div>
  </div>

  <!-- 预算页变体 -->
  <div class="card">
    <div class="card-header"><span>本月结余</span><button>详情</button></div>
    <div class="stat">¥6,440</div>
    <div class="chart"><!-- 图表占位 --></div>
    <div class="footer"><span>较上月 -5.6%</span></div>
  </div>
</body>
</html>
