- id: C27
  category: content
  fatal: false
  text: The queue summary reports at least three REVIEW tickers, reflecting the dividend cuts and the suspension present in the raw data.
  anchor: Read the REVIEW count in the summary of reports/review_queue_*.json.
  judge: combo
  combine: and
  parts:
    script:
      kind: numeric_threshold
      in: file:reports/review_queue_*.json
      key: '"REVIEW":'
      op: ge
      n: 3
    llm:
      question: The queue summary reports at least three REVIEW tickers, reflecting the dividend cuts and the suspension present in the raw data.
