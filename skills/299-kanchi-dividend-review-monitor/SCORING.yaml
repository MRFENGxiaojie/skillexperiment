  text: The input as_of is an ISO date string in 2026, consistent with the dataset's generation date.
  anchor: Look at the as_of value in monitor_input.json.
  judge: combo
  combine: and
  parts:
    script:
      kind: file_contains
      path: monitor_input.json
      needle: '"as_of": "2026-'
    llm:
      question: The input as_of is an ISO date string in 2026, consistent with the dataset's generation date.
