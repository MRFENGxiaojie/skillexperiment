criteria:
- id: C06
  category: process
  fatal: false
  text: The normalized input file is created before the rule engine runs.
  anchor: Look in the tool_log for monitor_input being written before build_review_queue.
  judge: combo
  combine: and
  parts:
    script:
      kind: tool_log_order
      cmds:
      - monitor_input
      - build_review_queue
    llm:
      question: The normalized input file is created before the rule engine runs.
      evidence: Look in the tool_log for monitor_input being written before build_review_queue.
      source: tool_log
      pattern: monitor_input|build_review_queue
- id: C07
  category: format
  fatal: false
  text: A normalized input file monitor_input.json exists in the workspace root.
  anchor: Look for monitor_input.json in the workspace root.
  judge: combo
  combine: and
  parts:
    script:
      kind: file_exists
      path: monitor_input.json
    llm:
      question: A normalized input file monitor_input.json exists in the workspace root.
      evidence: Look for monitor_input.json in the workspace root.
      source: workspace
      path: monitor_input.json
- id: C10
  category: format
  fatal: false
  text: monitor_input.json is valid JSON with top-level as_of and holdings fields.
  anchor: Open monitor_input.json and check it parses and contains as_of and holdings.
  judge: combo
  combine: and
  parts:
    script:
      kind: json_schema
      path: monitor_input.json
      require_fields:
      - as_of
      - holdings
    llm:
      question: monitor_input.json is valid JSON with top-level as_of and holdings fields.
      evidence: Open monitor_input.json and check it parses and contains as_of and holdings.
      source: workspace
      path: monitor_input.json
