criteria:
- id: C02
  category: process
  fatal: false
  text: In the agent's tool sequence, a Read tool call precedes the first Write tool call, so the manuscript is read before any file is written.
  anchor: Check the tool log ordering of the first Read versus the first Write.
  judge: combo
  combine: and
  parts:
    script:
      kind: tool_log_order
      cmds:
      - Read
      - Write
    llm:
      question: In the agent's tool sequence, a Read tool call precedes the first Write tool call, so the manuscript is read before any file is written.
      evidence: Check the tool log ordering of the first Read versus the first Write.
      source: tool_log
      pattern: Read|Write
