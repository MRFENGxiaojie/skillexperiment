- id: C25
  category: process
  fatal: false
  text: Tests are added and verified one at a time, keeping the feedback loop short.
  anchor: In the tool log sequence, look for write-test-run cycles rather than one bulk write.
  judge: combo
  combine: and
  parts:
    script:
      kind: count
      what: npm
      op: ge
      n: 3
    llm:
      question: Tests are added and verified one at a time (write-test-run cycles) rather than
        written in one bulk pass and run once at the end.
      evidence: In the tool log sequence, look for interleaved write-then-run cycles rather than one
        bulk write followed by a single run.
      source: tool_log
      pattern: npm|pytest|jest|vitest|python -m
