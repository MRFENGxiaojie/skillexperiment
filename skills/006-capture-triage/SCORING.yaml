skill: 006-capture-triage
version: 2
total_items: 19
criteria:
- id: C02
  category: tool
  fatal: false
  text: The agent lists Inbox root .md files with a root-only glob (e.g., Inbox/*.md) rather than a recursive scan.
  anchor: Look in the tool log for an ls command or Glob pattern matching Inbox/*.md.
  judge: combo
  combine: and
  parts:
    script:
      kind: tool_log_contains
      cmd: Inbox/\*\.md
    llm:
      question: The agent lists Inbox root .md files with a root-only glob (e.g., Inbox/*.md) rather than a recursive scan.
      evidence: Look in the tool log for an ls command or Glob pattern matching Inbox/*.md.
      source: tool_log
      pattern: Inbox/\*\.md
- id: C03
  category: negative
  fatal: false
  text: The agent reads or globs no capture files from Inbox subdirectories; only Inbox-root .md files are processed.
  anchor: Scan the tool log for any Read/Glob/mv path pointing at a .md file inside an Inbox subdirectory.
  judge: combo
  combine: and
  parts:
    script:
      kind: tool_log_not_contains
      cmd: Inbox/[^/]+/[^/]+\.md
    llm:
      question: The agent reads or globs no capture files from Inbox subdirectories; only Inbox-root .md files are processed.
      evidence: Scan the tool log for any Read/Glob/mv path pointing at a .md file inside an Inbox subdirectory.
      source: tool_log
      pattern: Inbox/[^/]+/[^/]+\.md
- id: C04
  category: coverage
  fatal: false
  text: The agent reports finding all 5 captures in the Inbox before classifying them.
  anchor: Look at the agent's final output for the preview line 'Found 5 captures'.
  judge: combo
  combine: and
  parts:
    script:
      kind: numeric_threshold
      in: output
      key: Found\s*\**\s*(\d+)\s*\**\s*captures
      op: eq
      n: 5
    llm:
      question: The agent reports finding all 5 captures in the Inbox before classifying them.
      evidence: Look at the agent's final output for the preview line 'Found 5 captures'.
      source: output
      needle: Found (\d+) captures
