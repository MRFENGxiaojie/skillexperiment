criteria:
- id: C02
  category: process
  fatal: false
  text: The agent reads the ip-legal practice profile (CLAUDE.md) before reading the invention disclosure.
  anchor: In the tool log, the Read of CLAUDE.md must precede the Read of disclosure-form.md.
  judge: combo
  combine: and
  parts:
    script:
      kind: tool_log_order
      cmds:
      - CLAUDE.md
      - disclosure-form.md
    llm:
      question: The agent reads the ip-legal practice profile (CLAUDE.md) before reading the invention disclosure.
      evidence: In the tool log, the Read of CLAUDE.md must precede the Read of disclosure-form.md.
      source: tool_log
      pattern: CLAUDE.md|disclosure-form.md
- id: C04
  category: negative
  fatal: false
  text: The agent does not fabricate missing intake facts (conception date, inventor identity beyond the form, disclosure dates, commercial plans); anything unknown is listed as an open question in the memo.
  anchor: Compare stated facts in the memo against the filled/blank fields of task/docs/disclosure-form.md.
  judge: llm
  check:
    question: The agent does not fabricate missing intake facts (conception date, inventor identity beyond the form, disclosure dates, commercial plans); anything unknown is listed as an open question in the memo.
    evidence: Compare stated facts in the memo against the filled/blank fields of task/docs/disclosure-form.md.
